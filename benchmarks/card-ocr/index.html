<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MTG multi-card OCR benchmark</title>
    <style>
      body { font: 16px system-ui, sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; color: #20232a; }
      img { display: block; width: 100%; max-height: 500px; object-fit: contain; border-radius: 8px; background: #222; }
      #photo-stage { position: relative; }
      #scan-box { position: absolute; box-sizing: border-box; border: 2px solid #a65350; background: rgba(166, 83, 80, .07); border-radius: 3px; pointer-events: none; z-index: 1; }
      #scan-box[hidden] { display: none; }
      #scan-label { position: absolute; left: -2px; bottom: calc(100% + 5px); padding: .15rem .4rem; color: #8e2524; background: rgba(255, 255, 255, .94); border: 1px solid #a65350; border-radius: 3px; white-space: nowrap; font-size: .8rem; font-weight: 600; }
      button { margin-top: 1rem; padding: .7rem 1rem; font: inherit; cursor: pointer; }
      progress { display: block; width: 100%; height: .75rem; margin: 1rem 0 .4rem; accent-color: #a65350; }
      #results { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: .5rem; padding: 0; list-style: none; }
      #results li { border: 1px solid #ccd0d5; border-radius: 6px; padding: .5rem .7rem; }
      #results small { display: block; color: #5c626a; overflow-wrap: anywhere; }
      .hit { border-left: 5px solid #2e7d32 !important; }
      .miss { border-left: 5px solid #b71c1c !important; }
      .note { color: #5c626a; }
    </style>
  </head>
  <body>
    <h1>MTG multi-card OCR benchmark</h1>
    <p class="note">This test uses 40 manually marked title strips in the photo. It measures OCR recognition after locating each card; it does not claim automatic card detection.</p>
    <button id="run" type="button">Read all 40 title strips</button>
    <progress id="progress" max="40"></progress>
    <p id="status" role="status">Ready</p>
    <a href="/res/multi-card.jpg" target="_blank" rel="noreferrer">Open the full-resolution photo</a>
    <div id="photo-stage">
      <img id="photo" src="/res/multi-card.jpg" alt="Forty Magic cards arranged in overlapping stacks on a playmat">
      <div id="scan-box" hidden><span id="scan-label"></span></div>
    </div>
    <ul id="results"></ul>
    <script type="module" src="/browser.js"></script>
  </body>
</html>
